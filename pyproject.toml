[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-pulse"
version = "0.1.0"
description = "Demand forecasting and operational anomaly detection for the Mexico City Metro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Oscar Juarez" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "holidays>=0.50",
    "duckdb>=0.10",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1"]
viz = ["plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "httpx2>=0.1"]


[tool.setuptools.packages.find]
where = ["src"]

# The dashboard is a data file, and setuptools ships only .py unless told
# otherwise. Without this the wheel installs cleanly, the service starts, every
# JSON endpoint answers -- and "/" returns 500 because index.html was never
# packaged. It is invisible from a source checkout, where the file is simply
# there on disk.
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"metro_pulse.api" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
